name: Build and Release Multi-Platform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. WINDOWS BUILD (x86_64)
  # ==========================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract SFML 2.6.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.sfml-dev.org/files/SFML-2.6.2-windows-vc17-64-bit.zip" -OutFile "sfml.zip"
          Expand-Archive -Path "sfml.zip" -DestinationPath "${{ github.workspace }}\sfml"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DSFML_DIR="${{ github.workspace }}/sfml/SFML-2.6.2/lib/cmake/SFML"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Prepare Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          DIST_NAME="chess-gui-${VERSION}-windows-x64"
          mkdir "$DIST_NAME"

          # 1. Copy Executable
          if [ -f "build/Release/chess-gui.exe" ]; then
            cp "build/Release/chess-gui.exe" "$DIST_NAME/"
          else
            cp "build/chess-gui.exe" "$DIST_NAME/"
          fi
          
          # 2. Copy SFML DLLs (including openal32.dll)
          cp sfml/SFML-2.6.2/bin/*.dll "$DIST_NAME/"

          # 3. Copy Resources (Including Icon)
          mkdir -p "$DIST_NAME/Resources"
          
          if [ -d "build/Resources" ]; then
             cp -r "build/Resources/"* "$DIST_NAME/Resources/"
          elif [ -d "Resources" ]; then
             cp -r "Resources/"* "$DIST_NAME/Resources/"
          fi

          if [ -f "build/Resources/icon.png" ]; then
             cp "build/Resources/icon.png" "$DIST_NAME/Resources/icon.png"
          fi

          7z a "${DIST_NAME}.zip" "$DIST_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "*.zip"
  # ==========================================================
  # 2. MACOS BUILD (Intel & Apple Silicon)
  # ==========================================================
  build-macos:
    name: build-macos-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - target_arch: x86_64
            runs_on: macos-15-intel
          - target_arch: arm64
            runs_on: macos-14 
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: brew install sfml@2 create-dmg

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VOL_NAME="ChessGUI"
          DMG_NAME="chess-gui-${VERSION}-macos-${{ matrix.target_arch }}.dmg"
          STAGING="dist"
          
          mkdir -p "$STAGING"
          
          # 1. Copy Binary
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" "$STAGING/chess-gui"
          chmod +x "$STAGING/chess-gui"

          # 2. Copy Resources
          mkdir -p "$STAGING/Resources"
          if [ -d "build/Resources" ]; then
             cp -r "build/Resources/"* "$STAGING/Resources/"
          elif [ -d "Resources" ]; then
             cp -r "Resources/"* "$STAGING/Resources/"
          fi

          # 3. Handle Icon for DMG
          ICON_PATH="$STAGING/Resources/icon.png"
          
          # Force copy from build folder if missing in staging
          if [ ! -f "$ICON_PATH" ] && [ -f "build/Resources/icon.png" ]; then
             cp "build/Resources/icon.png" "$ICON_PATH"
          fi
          
          # Note: create-dmg expects an .icns or can use a raw file, 
          # but usually requires an App Bundle (.app) for full icon support.
          # Since this is a raw binary, we just ensure the file is inside the folder.
          
          create-dmg \
            --volname "$VOL_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --hide-extension "chess-gui" \
            "$DMG_NAME" \
            "$STAGING"

          zip "${DMG_NAME}.zip" "$DMG_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target_arch }}
          path: "*.dmg.zip"

  # ==========================================================
  # 3. LINUX BUILD (AppImage, Deb, Rpm)
  # ==========================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Deps
        run: |
          sudo apt-get update
          # Added 'imagemagick' to fix 'convert: command not found'
          sudo apt-get install -y build-essential cmake libsfml-dev ruby ruby-dev rpm libfuse2 imagemagick
          sudo gem install --no-document fpm
          
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --config Release

      - name: Prepare Staging
        run: |
          mkdir -p AppDir/usr/bin
          
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" AppDir/usr/bin/chess-gui
          
          # Copy resources to be next to binary
          if [ -d "build/Resources" ]; then cp -r "build/Resources" AppDir/usr/bin/;
          elif [ -d "Resources" ]; then cp -r "Resources" AppDir/usr/bin/; fi

      - name: Create AppImage
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          
          # 1. Create Desktop File
          cat > chess-gui.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Chess GUI
          Exec=chess-gui
          Icon=chess-gui
          Categories=Game;
          EOF
          
          # 2. Prepare Icon
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          ICON_DEST="AppDir/usr/share/icons/hicolor/256x256/apps/chess-gui.png"
          
          # Look for the icon in build/Resources first
          if [ -f "build/Resources/icon.png" ]; then
            echo "Using icon from build/Resources/icon.png"
            cp "build/Resources/icon.png" "$ICON_DEST"
          elif [ -f "Resources/icon.png" ]; then
            echo "Using icon from Resources/icon.png"
            cp "Resources/icon.png" "$ICON_DEST"
          else
            echo "Icon not found, generating fallback red square"
            convert -size 256x256 xc:red "$ICON_DEST"
          fi
          
          # Copy icon to .DirIcon so the AppImage file itself looks right in file explorer
          cp "$ICON_DEST" "AppDir/.DirIcon"

          # 3. Build AppImage
          linuxdeploy --appdir AppDir --desktop-file chess-gui.desktop --output appimage
          mv Chess_GUI-*.AppImage "chess-gui-${VERSION}-linux-x86_64.AppImage"

      - name: Create DEB & RPM
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${VERSION#v}"
          
          PKG_ROOT="pkg-root"
          mkdir -p "$PKG_ROOT/opt/chess-gui"
          cp -r AppDir/usr/bin/* "$PKG_ROOT/opt/chess-gui/"
          
          # Copy Icon for system integration
          mkdir -p "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"
          cp "AppDir/usr/share/icons/hicolor/256x256/apps/chess-gui.png" "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/chess-gui.png"
          
          # Copy Desktop file
          mkdir -p "$PKG_ROOT/usr/share/applications"
          cp chess-gui.desktop "$PKG_ROOT/usr/share/applications/"
          
          echo '#!/bin/bash' > post-install.sh
          echo 'ln -sf /opt/chess-gui/chess-gui /usr/bin/chess-gui' >> post-install.sh
          echo 'gtk-update-icon-cache /usr/share/icons/hicolor || true' >> post-install.sh
          echo 'update-desktop-database /usr/share/applications || true' >> post-install.sh
          
          echo '#!/bin/bash' > post-uninstall.sh
          echo 'rm -f /usr/bin/chess-gui' >> post-uninstall.sh
          echo 'gtk-update-icon-cache /usr/share/icons/hicolor || true' >> post-uninstall.sh
          echo 'update-desktop-database /usr/share/applications || true' >> post-uninstall.sh

          fpm -s dir -t deb -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .

          fpm -s dir -t rpm -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .

          mv chess-gui_*.deb "chess-gui-${VERSION}-linux-amd64.deb"
          mv chess-gui-*.x86_64.rpm "chess-gui-${VERSION}-linux-x86_64.rpm"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.AppImage
            *.deb
            *.rpm

  # ==========================================================
  # 4. RELEASE
  # ==========================================================
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
