name: Build and Release Multi-Platform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. WINDOWS BUILD (x86_64)
  # ==========================================================
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: "C:/vcpkg"
    steps:
      - uses: actions/checkout@v4

      # --- FIX: Downgrade vcpkg to ensure we get SFML 2.x, not 3.x ---
      - name: Pin vcpkg to SFML 2.x
        shell: pwsh
        run: |
          cd $env:VCPKG_ROOT
          git fetch --unshallow
          # This commit is from late 2024, ensuring SFML 2.6.1
          git checkout 5e5d0e1cd7785623065e77eff011afdeec1a3574
          ./bootstrap-vcpkg.bat

      - name: Install SFML via vcpkg
        shell: pwsh
        run: |
          vcpkg install sfml:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Prepare Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          DIST_NAME="chess-gui-${VERSION}-windows-x64"
          mkdir "$DIST_NAME"

          # Copy Executable & DLLs
          if [ -f "build/Release/chess-gui.exe" ]; then
            cp "build/Release/chess-gui.exe" "$DIST_NAME/"
            cp "build/Release/"*.dll "$DIST_NAME/"
          else
            cp "build/chess-gui.exe" "$DIST_NAME/"
            find "build" -name "*.dll" -exec cp {} "$DIST_NAME/" \;
          fi

          # Copy Resources
          if [ -d "build/Resources" ]; then
             cp -r "build/Resources" "$DIST_NAME/Resources"
          elif [ -d "Resources" ]; then
             cp -r "Resources" "$DIST_NAME/Resources"
          fi

          7z a "${DIST_NAME}.zip" "$DIST_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "*.zip"

  # ==========================================================
  # 2. MACOS BUILD (Intel & Apple Silicon)
  # ==========================================================
  build-macos:
    name: build-macos-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - target_arch: x86_64
            runs_on: macos-15-intel
          - target_arch: arm64
            runs_on: macos-14 
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: brew install sfml@2 create-dmg

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VOL_NAME="ChessGUI"
          DMG_NAME="chess-gui-${VERSION}-macos-${{ matrix.target_arch }}.dmg"
          STAGING="dist"
          
          mkdir -p "$STAGING"
          
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" "$STAGING/chess-gui"
          chmod +x "$STAGING/chess-gui"

          if [ -d "build/Resources" ]; then cp -r "build/Resources" "$STAGING/";
          elif [ -d "Resources" ]; then cp -r "Resources" "$STAGING/"; fi

          create-dmg \
            --volname "$VOL_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon "chess-gui" 200 190 \
            --hide-extension "chess-gui" \
            "$DMG_NAME" \
            "$STAGING"

          zip "${DMG_NAME}.zip" "$DMG_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target_arch }}
          path: "*.dmg.zip"

  # ==========================================================
  # 3. LINUX BUILD (AppImage, Deb, Rpm)
  # ==========================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsfml-dev ruby ruby-dev rpm libfuse2
          sudo gem install --no-document fpm
          
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --config Release

      - name: Prepare Staging
        run: |
          mkdir -p AppDir/usr/bin
          
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" AppDir/usr/bin/chess-gui
          
          if [ -d "build/Resources" ]; then cp -r "build/Resources" AppDir/usr/bin/;
          elif [ -d "Resources" ]; then cp -r "Resources" AppDir/usr/bin/; fi

      # --- FIX: Ensure Icon Exists for AppImage ---
      - name: Create AppImage
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          
          # 1. Create Desktop File
          cat > chess-gui.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Chess GUI
          Exec=chess-gui
          Icon=chess-gui
          Categories=Game;
          EOF
          
          # 2. Prepare Icon (AppImage requires an icon file to exist)
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Check if Resources has a png, otherwise make a dummy one
          if [ -f "Resources/icon.png" ]; then
            cp "Resources/icon.png" "AppDir/usr/share/icons/hicolor/256x256/apps/chess-gui.png"
          elif [ -f "Resources/piece_w.png" ]; then
             # Fallback to a piece image if exact icon.png missing
             cp "Resources/piece_w.png" "AppDir/usr/share/icons/hicolor/256x256/apps/chess-gui.png"
          else
            # Create a dummy red square icon if NO images found (prevents crash)
            convert -size 256x256 xc:red "AppDir/usr/share/icons/hicolor/256x256/apps/chess-gui.png"
          fi

          # 3. Build AppImage
          linuxdeploy --appdir AppDir --desktop-file chess-gui.desktop --output appimage
          mv Chess_GUI-*.AppImage "chess-gui-${VERSION}-linux-x86_64.AppImage"

      - name: Create DEB & RPM
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${VERSION#v}"
          
          PKG_ROOT="pkg-root"
          mkdir -p "$PKG_ROOT/opt/chess-gui"
          cp -r AppDir/usr/bin/* "$PKG_ROOT/opt/chess-gui/"
          
          echo '#!/bin/bash' > post-install.sh
          echo 'ln -sf /opt/chess-gui/chess-gui /usr/bin/chess-gui' >> post-install.sh
          
          echo '#!/bin/bash' > post-uninstall.sh
          echo 'rm -f /usr/bin/chess-gui' >> post-uninstall.sh

          fpm -s dir -t deb -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .

          fpm -s dir -t rpm -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .

          mv chess-gui_*.deb "chess-gui-${VERSION}-linux-amd64.deb"
          mv chess-gui-*.x86_64.rpm "chess-gui-${VERSION}-linux-x86_64.rpm"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.AppImage
            *.deb
            *.rpm

  # ==========================================================
  # 4. RELEASE
  # ==========================================================
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
