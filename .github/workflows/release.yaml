name: Build and Release Multi-Platform

# A `v*` tag builds every package and publishes a GitHub release.
# Any other trigger is a dry run: the packages are built and uploaded as
# workflow artifacts, and no release is created. Pushes that touch the
# packaging inputs run the dry run automatically.
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/release.yaml"
      - "CMakeLists.txt"
      - "src/cli.cpp"
      - "BundleInfo.plist.in"
      - "Info.plist"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Package version: the tag name for releases, "dev-<sha>" for dry runs.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  # ==========================================================
  # 1. WINDOWS BUILD (x86_64)
  # ==========================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --config Release --parallel

      - name: Prepare Package
        shell: bash
        run: |
          DIST_NAME="chess-gui-${VERSION:0:16}-windows-x64"
          mkdir "$DIST_NAME"
          # SFML and the C++ runtime are linked statically: no DLLs to ship.
          cp build/Release/chess-gui.exe build/Release/chess-cli.exe "$DIST_NAME/"
          cp -r Resources "$DIST_NAME/Resources"
          cp LICENSE "$DIST_NAME/"
          7z a "${DIST_NAME}.zip" "$DIST_NAME"
          # the command-line tool on its own (fixed name: the GitHub Action downloads it)
          mkdir chess-cli && cp build/Release/chess-cli.exe LICENSE chess-cli/ && cp -r Resources chess-cli/Resources
          7z a chess-cli-windows-x64.zip ./chess-cli/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: "*.zip"

  # ==========================================================
  # 2. MACOS BUILD (Intel & Apple Silicon)
  # ==========================================================
  build-macos:
    name: build-macos-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - target_arch: x86_64
            runs_on: macos-15-intel
          - target_arch: arm64
            runs_on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --config Release --parallel

      - name: Create DMG
        run: |
          DMG_NAME="chess-gui-${VERSION:0:16}-macos-${{ matrix.target_arch }}.dmg"
          STAGING="dist"
          mkdir -p "$STAGING"
          # The .app bundle carries Info.plist (Retina) and its own Resources.
          cp -R "build/Chess GUI for UCI.app" "$STAGING/"
          cp LICENSE "$STAGING/"
          cp build/chess-cli "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "ChessGUI" -srcfolder "$STAGING" -ov -format UDZO "$DMG_NAME"
          # the command-line tool on its own (fixed name: the GitHub Action downloads it)
          mkdir chess-cli && cp build/chess-cli LICENSE chess-cli/ && cp -R Resources chess-cli/Resources
          tar -czf "chess-cli-macos-${{ matrix.target_arch }}.tar.gz" -C chess-cli .

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.target_arch }}
          path: |
            *.dmg
            chess-cli-*.tar.gz

  # ==========================================================
  # 3. LINUX BUILD (AppImage, Deb, Rpm)
  # ==========================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxcursor-dev \
            libxi-dev libudev-dev libgl1-mesa-dev libfreetype-dev ruby ruby-dev rpm libfuse2
          sudo gem install --no-document fpm

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --config Release --parallel

      - name: Prepare Staging
        run: |
          mkdir -p AppDir/usr/bin
          cp build/chess-gui AppDir/usr/bin/chess-gui
          cp build/chess-cli AppDir/usr/bin/chess-cli
          # Resources live next to the binary (the app chdirs to its own directory)
          cp -r Resources AppDir/usr/bin/

      - name: Create AppImage
        run: |
          V="${VERSION:0:16}"
          cat > chess-gui.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Chess GUI
          Exec=chess-gui
          Icon=chess-gui
          Categories=Game;
          EOF

          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          ICON_DEST="AppDir/usr/share/icons/hicolor/256x256/apps/chess-gui.png"
          cp Resources/icon.png "$ICON_DEST"
          cp "$ICON_DEST" "AppDir/.DirIcon"

          linuxdeploy --appdir AppDir --desktop-file chess-gui.desktop --output appimage
          mv Chess_GUI-*.AppImage "chess-gui-${V}-linux-x86_64.AppImage"

      - name: Create DEB & RPM
        run: |
          V="${VERSION:0:16}"
          CLEAN_VERSION="${V#v}"
          # deb/rpm versions must start with a digit
          case "$CLEAN_VERSION" in [0-9]*) ;; *) CLEAN_VERSION="0.0.0~${CLEAN_VERSION}" ;; esac

          PKG_ROOT="pkg-root"
          mkdir -p "$PKG_ROOT/opt/chess-gui"
          cp -r AppDir/usr/bin/* "$PKG_ROOT/opt/chess-gui/"

          mkdir -p "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"
          cp "AppDir/usr/share/icons/hicolor/256x256/apps/chess-gui.png" "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/chess-gui.png"

          mkdir -p "$PKG_ROOT/usr/share/applications"
          cp chess-gui.desktop "$PKG_ROOT/usr/share/applications/"

          echo '#!/bin/bash' > post-install.sh
          echo 'ln -sf /opt/chess-gui/chess-gui /usr/bin/chess-gui' >> post-install.sh
          echo 'ln -sf /opt/chess-gui/chess-cli /usr/bin/chess-cli' >> post-install.sh
          echo 'gtk-update-icon-cache /usr/share/icons/hicolor || true' >> post-install.sh
          echo 'update-desktop-database /usr/share/applications || true' >> post-install.sh

          echo '#!/bin/bash' > post-uninstall.sh
          echo 'rm -f /usr/bin/chess-gui /usr/bin/chess-cli' >> post-uninstall.sh
          echo 'gtk-update-icon-cache /usr/share/icons/hicolor || true' >> post-uninstall.sh
          echo 'update-desktop-database /usr/share/applications || true' >> post-uninstall.sh

          fpm -s dir -t deb -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .

          fpm -s dir -t rpm -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .

          mv chess-gui_*.deb "chess-gui-${V}-linux-amd64.deb"
          mv chess-gui-*.rpm "chess-gui-${V}-linux-x86_64.rpm"

      - name: Package chess-cli
        run: |
          # the command-line tool on its own (fixed name: the GitHub Action downloads it)
          mkdir chess-cli && cp build/chess-cli LICENSE chess-cli/ && cp -r Resources chess-cli/Resources
          tar -czf chess-cli-linux-x86_64.tar.gz -C chess-cli .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: |
            chess-cli-*.tar.gz
            *.AppImage
            *.deb
            *.rpm

  # ==========================================================
  # 4. RELEASE (tags only)
  # ==========================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
