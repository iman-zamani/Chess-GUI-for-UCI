name: Build and Release Multi-Platform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. WINDOWS BUILD (x86_64)
  # ==========================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install SFML 2.x + toolchain via vcpkg (reliable on Windows)
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "6f29f12b9b1c0b7d2f0a5d4a3e1f0a0f6f7e9c2a" # pin to avoid surprises

      - name: Install SFML 2.x (vcpkg)
        shell: pwsh
        run: |
          vcpkg install sfml[graphics,window,system]:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: |
          cd build
          cmake --build . --config Release

      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -f "build/Release/chess-gui.exe" ]; then
            cp "build/Release/chess-gui.exe" "chess-gui-${VERSION}-windows-x64.exe"
          else
            cp "build/chess-gui.exe" "chess-gui-${VERSION}-windows-x64.exe"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: chess-gui-*-windows-x64.exe

  # ==========================================================
  # 2. MACOS BUILD (Intel & Apple Silicon)
  # ==========================================================
  build-macos:
    name: build-macos-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - target_arch: x86_64
            runs_on: macos-15-intel
          - target_arch: arm64
            runs_on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SFML 2.x
        run: |
          brew update
          brew install cmake sfml@2

      - name: Configure
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" "chess-gui-${VERSION}-macos-${{ matrix.target_arch }}"
          chmod +x "chess-gui-${VERSION}-macos-${{ matrix.target_arch }}"
          zip "chess-gui-${VERSION}-macos-${{ matrix.target_arch }}.zip" "chess-gui-${VERSION}-macos-${{ matrix.target_arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target_arch }}
          path: chess-gui-*-macos-*.zip

  # ==========================================================
  # 3. LINUX BUILD + Packaging (tar.gz, .deb, .rpm)
  # ==========================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Deps (SFML 2.x + packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsfml-dev \
            ruby ruby-dev rpm
          sudo gem install --no-document fpm

      - name: Configure
        run: |
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Package Tarball + DEB + RPM
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${VERSION#v}"

          # collect the binary
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          chmod +x "$BIN"

          # tar.gz
          cp "$BIN" chess-gui
          tar -czvf "chess-gui-${VERSION}-linux-x64.tar.gz" chess-gui

          # deb/rpm (installs to /usr/local/bin/chess-gui)
          fpm -s dir -t deb -n chess-gui -v "${CLEAN_VERSION}" \
            --prefix /usr/local/bin \
            --description "Chess GUI (SFML 2.x)" \
            chess-gui

          fpm -s dir -t rpm -n chess-gui -v "${CLEAN_VERSION}" \
            --prefix /usr/local/bin \
            --description "Chess GUI (SFML 2.x)" \
            chess-gui

          mv chess-gui_*.deb "chess-gui-${VERSION}-linux-amd64.deb"
          mv chess-gui-*.x86_64.rpm "chess-gui-${VERSION}-linux-x86_64.rpm"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            chess-gui-*-linux-x64.tar.gz
            chess-gui-*-linux-amd64.deb
            chess-gui-*-linux-x86_64.rpm

  # ==========================================================
  # 4. RELEASE
  # ==========================================================
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
