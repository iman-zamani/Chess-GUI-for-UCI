name: Build and Release Multi-Platform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. WINDOWS BUILD (x86_64)
  # ==========================================================
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: "C:/vcpkg"
    steps:
      - uses: actions/checkout@v4

      - name: Install SFML via vcpkg
        shell: pwsh
        run: vcpkg install sfml:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          DIST_NAME="chess-gui-${VERSION}-windows-x64"
          mkdir -p "$DIST_NAME"

          # 1. Copy Executable
          if [ -f "build/Release/chess-gui.exe" ]; then
            cp "build/Release/chess-gui.exe" "$DIST_NAME/"
            cp "build/Release/"*.dll "$DIST_NAME/" || true
          else
            cp "build/chess-gui.exe" "$DIST_NAME/"
            find "build" -name "*.dll" -exec cp {} "$DIST_NAME/" \;
          fi

          # 2. Copy Resources (Critical)
          if [ -d "Resources" ]; then cp -r "Resources" "$DIST_NAME/"; fi

          # 3. Zip
          7z a "${DIST_NAME}.zip" "$DIST_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "*.zip"

  # ==========================================================
  # 2. MACOS BUILD (Intel & Apple Silicon on macos-14)
  # ==========================================================
  build-macos:
    name: build-macos-${{ matrix.target_arch }}
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target_arch: x86_64
            sfml_arch: "clang"   
            cmake_arch: "x86_64"
          - target_arch: arm64
            sfml_arch: "clang-arm64"
            cmake_arch: "arm64"
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: brew install create-dmg

      # MANUAL INSTALL: Solves the Homebrew architecture mismatch
      - name: Install SFML 2.6.1 (Manual SDK)
        run: |
          echo "Downloading SFML for ${{ matrix.target_arch }}..."
          curl -L -O https://www.sfml-dev.org/files/SFML-2.6.1-macOS-${{ matrix.sfml_arch }}.tar.gz
          tar -xzf SFML-2.6.1-macOS-${{ matrix.sfml_arch }}.tar.gz
          mv SFML-2.6.1 SFML_SDK

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DSFML_DIR=${{ github.workspace }}/SFML_SDK/lib/cmake/SFML

      - name: Build
        run: cmake --build build --config Release

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VOL_NAME="ChessGUI"
          DMG_NAME="chess-gui-${VERSION}-macos-${{ matrix.target_arch }}.dmg"
          STAGING="dist"
          
          mkdir -p "$STAGING"

          # 1. Copy Binary
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" "$STAGING/chess-gui"
          chmod +x "$STAGING/chess-gui"
          
          # 2. Copy dylibs (Fixes "Library not loaded" error on other Macs)
          # We must copy the SFML frameworks into the dist folder and fix paths, 
          # OR for simplicity in this script, we assume static linking or user installs libs.
          # To make it truly portable, we usually copy the Frameworks/dylibs next to the binary.
          cp -r SFML_SDK/lib/*.dylib "$STAGING/"

          # 3. Copy Resources (Critical)
          if [ -d "Resources" ]; then cp -r "Resources" "$STAGING/"; fi

          # 4. Create DMG
          create-dmg \
            --volname "$VOL_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon "chess-gui" 200 190 \
            --hide-extension "chess-gui" \
            "$DMG_NAME" \
            "$STAGING"

          # 5. Zip
          zip "${DMG_NAME}.zip" "$DMG_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target_arch }}
          path: "*.dmg.zip"

  # ==========================================================
  # 3. LINUX BUILD (AppImage, Deb, Rpm)
  # ==========================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsfml-dev ruby ruby-dev rpm libfuse2
          sudo gem install --no-document fpm
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --config Release

      - name: Package Linux
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${VERSION#v}"
          
          # Setup Staging
          mkdir -p AppDir/usr/bin
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" AppDir/usr/bin/chess-gui

          # Copy Resources (Critical)
          if [ -d "Resources" ]; then cp -r "Resources" AppDir/usr/bin/; fi

          # --- AppImage ---
          cat > chess-gui.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Chess GUI
          Exec=chess-gui
          Icon=utilities-terminal
          Categories=Game;
          EOF
          
          linuxdeploy --appdir AppDir --desktop-file chess-gui.desktop --output appimage
          mv Chess_GUI-*.AppImage "chess-gui-${VERSION}-linux-x86_64.AppImage"

          # --- DEB/RPM Staging ---
          PKG_ROOT="pkg-root"
          mkdir -p "$PKG_ROOT/opt/chess-gui"
          cp -r AppDir/usr/bin/* "$PKG_ROOT/opt/chess-gui/"

          # Scripts for symlinking
          echo '#!/bin/bash' > post-install.sh
          echo 'ln -sf /opt/chess-gui/chess-gui /usr/bin/chess-gui' >> post-install.sh
          echo '#!/bin/bash' > post-uninstall.sh
          echo 'rm -f /usr/bin/chess-gui' >> post-uninstall.sh

          fpm -s dir -t deb -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .
          
          fpm -s dir -t rpm -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh --after-remove post-uninstall.sh \
            --description "Chess GUI" -C "$PKG_ROOT" .

          mv chess-gui_*.deb "chess-gui-${VERSION}-linux-amd64.deb"
          mv chess-gui-*.x86_64.rpm "chess-gui-${VERSION}-linux-x86_64.rpm"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.AppImage
            *.deb
            *.rpm

  # ==========================================================
  # 4. RELEASE
  # ==========================================================
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
