name: Build and Release Multi-Platform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. WINDOWS BUILD (x86_64)
  # ==========================================================
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: "C:/vcpkg"
    steps:
      - uses: actions/checkout@v4

      # 1. Install Dependencies
      - name: Install SFML via vcpkg
        shell: pwsh
        run: |
          vcpkg install sfml:x64-windows

      # 2. Configure & Build
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      # 3. Package
      - name: Prepare Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          DIST_NAME="chess-gui-${VERSION}-windows-x64"
          mkdir "$DIST_NAME"

          # Copy Executable
          if [ -f "build/Release/chess-gui.exe" ]; then
            cp "build/Release/chess-gui.exe" "$DIST_NAME/"
            cp "build/Release/"*.dll "$DIST_NAME/"
          else
            cp "build/chess-gui.exe" "$DIST_NAME/"
            # Try to find DLLs if they aren't in Release (vcpkg quirk)
            find "build" -name "*.dll" -exec cp {} "$DIST_NAME/" \;
          fi

          # Copy Resources (Critical!)
          # Assuming Resources is in root of repo. Adjust path if it's in src/ or build/
          if [ -d "build/Resources" ]; then
             cp -r "build/Resources" "$DIST_NAME/Resources"
          elif [ -d "Resources" ]; then
             cp -r "Resources" "$DIST_NAME/Resources"
          else
             echo "WARNING: Resources directory not found!"
          fi

          # Create Zip
          7z a "${DIST_NAME}.zip" "$DIST_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "*.zip"

  # ==========================================================
  # 2. MACOS BUILD (Intel & Apple Silicon)
  # ==========================================================
  build-macos:
    name: build-macos-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - target_arch: x86_64
            runs_on: macos-15-intel
          - target_arch: arm64
            runs_on: macos-14   
    steps:
      - uses: actions/checkout@v4

      # 1. Install Dependencies
      - name: Install Tools
        run: |
          brew install sfml@2 create-dmg

      # 2. Configure & Build
      - name: Configure & Build
        run: |
          # Use our smart CMakeLists.txt that finds sfml@2 automatically
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # 3. Package DMG
      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VOL_NAME="ChessGUI"
          DMG_NAME="chess-gui-${VERSION}-macos-${{ matrix.target_arch }}.dmg"
          STAGING="dist"
          
          mkdir -p "$STAGING"
          
          # Find and Copy Binary
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" "$STAGING/chess-gui"
          chmod +x "$STAGING/chess-gui"

          # Copy Resources (Critical!)
          if [ -d "build/Resources" ]; then cp -r "build/Resources" "$STAGING/";
          elif [ -d "Resources" ]; then cp -r "Resources" "$STAGING/"; fi

          # Create DMG
          create-dmg \
            --volname "$VOL_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon "chess-gui" 200 190 \
            --hide-extension "chess-gui" \
            "$DMG_NAME" \
            "$STAGING"

          # Zip the DMG (Github releases handle zips better)
          zip "${DMG_NAME}.zip" "$DMG_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target_arch }}
          path: "*.dmg.zip"

  # ==========================================================
  # 3. LINUX BUILD (AppImage, Deb, Rpm)
  # ==========================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Dependencies
      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsfml-dev ruby ruby-dev rpm libfuse2
          sudo gem install --no-document fpm
          
          # Install linuxdeploy for AppImage
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      # 2. Build
      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --config Release

      # 3. Prepare Staging Area
      - name: Prepare Staging
        run: |
          mkdir -p AppDir/usr/bin
          
          # Copy Binary
          BIN="build/chess-gui"
          if [ ! -f "$BIN" ] && [ -f "build/Release/chess-gui" ]; then BIN="build/Release/chess-gui"; fi
          cp "$BIN" AppDir/usr/bin/chess-gui
          
          # Copy Resources NEXT TO BINARY (safest for relative paths)
          if [ -d "build/Resources" ]; then cp -r "build/Resources" AppDir/usr/bin/;
          elif [ -d "Resources" ]; then cp -r "Resources" AppDir/usr/bin/; fi

      # 4. Create AppImage
      - name: Create AppImage
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          
          # Create a simple .desktop file required for AppImage
          cat > chess-gui.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Chess GUI
          Exec=chess-gui
          Icon=utilities-terminal
          Categories=Game;
          EOF
          
          # Build AppImage
          # We use --appimage-extract-and-run if linuxdeploy fails on runner, but usually it works directly
          linuxdeploy --appdir AppDir --desktop-file chess-gui.desktop --output appimage
          
          mv Chess_GUI-*.AppImage "chess-gui-${VERSION}-linux-x86_64.AppImage"

      # 5. Create DEB and RPM
      - name: Create DEB & RPM
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${VERSION#v}"
          
          # We use a trick for DEB/RPM: Install to /opt/chess-gui so Resources stay with Bin
          # Then we symlink the bin to /usr/bin
          
          PKG_ROOT="pkg-root"
          mkdir -p "$PKG_ROOT/opt/chess-gui"
          
          # Copy contents from AppDir/usr/bin (which has bin + Resources)
          cp -r AppDir/usr/bin/* "$PKG_ROOT/opt/chess-gui/"
          
          # Create post-install script to symlink
          echo '#!/bin/bash' > post-install.sh
          echo 'ln -sf /opt/chess-gui/chess-gui /usr/bin/chess-gui' >> post-install.sh
          
          # Create post-uninstall script to remove symlink
          echo '#!/bin/bash' > post-uninstall.sh
          echo 'rm -f /usr/bin/chess-gui' >> post-uninstall.sh

          # Build DEB
          fpm -s dir -t deb -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh \
            --after-remove post-uninstall.sh \
            --description "Chess GUI" \
            -C "$PKG_ROOT" .

          # Build RPM
          fpm -s dir -t rpm -n chess-gui -v "${CLEAN_VERSION}" \
            --after-install post-install.sh \
            --after-remove post-uninstall.sh \
            --description "Chess GUI" \
            -C "$PKG_ROOT" .

          # Rename
          mv chess-gui_*.deb "chess-gui-${VERSION}-linux-amd64.deb"
          mv chess-gui-*.x86_64.rpm "chess-gui-${VERSION}-linux-x86_64.rpm"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.AppImage
            *.deb
            *.rpm

  # ==========================================================
  # 4. RELEASE
  # ==========================================================
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
