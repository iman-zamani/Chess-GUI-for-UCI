name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl1-mesa-dev libfreetype-dev xvfb

      - name: Configure
        shell: bash
        run: |
          GUI_TESTS=OFF
          if [ "$RUNNER_OS" = "Linux" ]; then GUI_TESTS=ON; fi
          mkdir -p ci-logs
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESSGUI_GUI_TESTS=$GUI_TESTS 2>&1 | tee ci-logs/configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee ci-logs/build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            # includes the scripted GUI smoke test, on a virtual display
            xvfb-run -a -s "-screen 0 1600x1000x24" ctest --test-dir build -C Release --output-on-failure 2>&1 | tee ci-logs/test.log
          else
            ctest --test-dir build -C Release --output-on-failure 2>&1 | tee ci-logs/test.log
          fi

      - name: Annotate failure logs
        if: failure()
        shell: bash
        run: .github/scripts/annotate-logs.sh

      - name: Upload GUI smoke screenshot
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-smoke-${{ matrix.os }}
          path: build/gui_smoke.png
          if-no-files-found: ignore

  # The composite action at the repo root, run the way an engine repository
  # would use it, but with the chess-cli built here (no release needed).
  github-action:
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Build chess-cli and the mock engine (no GUI)
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESSGUI_BUILD_GUI=OFF
          cmake --build build --config Release --parallel --target chess-cli mock_engine
          cli=build/chess-cli; mock=build/tests/mock_engine
          if [ "$RUNNER_OS" = "Windows" ]; then cli=build/Release/chess-cli.exe; mock=build/tests/Release/mock_engine.exe; fi
          root=$PWD
          if [ "$RUNNER_OS" = "Windows" ]; then root=$(cygpath -m "$PWD"); fi   # C:/... for native programs
          echo "CLI=$root/$cli" >> "$GITHUB_ENV"
          echo "MOCK=$root/$mock" >> "$GITHUB_ENV"

      - name: Run the action against the mock engine
        uses: ./
        with:
          engine: ${{ env.MOCK }}
          chess-cli: ${{ env.CLI }}
          checks: uci-check,perft
          perft-args: --depth 3
